<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Same shut CSP as the desktop, plus connect-src 'self' so the renderer's
       api transport can reach the same-origin proxy (/api/tt/*). Everything else
       is same-origin; there is still no third party the page can talk to. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';">
  <title>TimeForest</title>
  <link rel="stylesheet" href="/client/renderer/app.css">
</head>
<body>
  <div id="app"></div>

  <!-- The browser implementation of window.host — must be in place before the
       renderer calls it. -->
  <script src="/web/host-web.js"></script>

  <!-- Shared libs (no copies — served straight from src/lib, same files the
       extension and desktop load) and the desktop renderer, unchanged. -->
  <script src="/src/lib/tz.js"></script>
  <script src="/src/lib/recur.js"></script>
  <script src="/src/lib/api.js"></script>
  <script src="/src/lib/model.js"></script>
  <script src="/src/lib/export.js"></script>
  <script src="/src/lib/map.js"></script>
  <script src="/client/renderer/cli-host.js"></script>
  <script src="/client/renderer/icons.js"></script>
  <script src="/client/renderer/store.js"></script>
  <script src="/client/renderer/app.js"></script>
</body>
</html>
