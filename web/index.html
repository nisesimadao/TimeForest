<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Same shut CSP as the desktop, plus connect-src 'self' so the renderer's
       api transport can reach the same-origin proxy (/api/tt/*). Everything else
       is same-origin; there is still no third party the page can talk to. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';">
  <title>TimeForest</title>
  <link rel="icon" href="./favicon.png">
  <!-- Served from web/dist (build.js), a self-contained bundle: ./lib and
       ./renderer are copies of src/lib and client/renderer made at build time,
       so nothing outside this directory is ever exposed. -->
  <link rel="stylesheet" href="./renderer/app.css">
</head>
<body>
  <div id="app"></div>

  <script src="./host-web.js"></script>

  <script src="./lib/tz.js"></script>
  <script src="./lib/recur.js"></script>
  <script src="./lib/api.js"></script>
  <script src="./lib/model.js"></script>
  <script src="./lib/export.js"></script>
  <script src="./lib/map.js"></script>
  <script src="./renderer/cli-host.js"></script>
  <script src="./renderer/icons.js"></script>
  <script src="./renderer/store.js"></script>
  <script src="./renderer/app.js"></script>
</body>
</html>
