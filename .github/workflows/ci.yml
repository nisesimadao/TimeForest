name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor we claim to support; 24 is what the client ships on.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # scripts/check.js deliberately has zero dependencies, so there is
      # nothing to install — no npm ci, no 144MB Electron download in CI.
      - name: Structural checks
        run: node scripts/check.js

      - name: Verify the userscript builds are reproducible
        run: |
          for b in build-userscript.js build-app-userscript.js; do node "$b"; done
          cp dist/timeforest.user.js /tmp/first.js
          cp dist/timeforest-app.user.js /tmp/first-app.js
          node build-userscript.js
          node build-app-userscript.js
          diff -q /tmp/first.js dist/timeforest.user.js
          diff -q /tmp/first-app.js dist/timeforest-app.user.js

      # Zero-dep, no browser: builds web/dist, boots the dev server, and checks it
      # serves the bundle + API routes and blocks traversal. Guards the hosted
      # client the way smoke-client guards the desktop.
      - name: Smoke-test the web client backend
        run: node scripts/smoke-web.js

      # Unit-test the Vercel serverless adapters (guards, path/body mapping) with
      # mock req/res — the production deploy code the dev server never runs.
      - name: Verify the Vercel API adapters
        run: node scripts/verify-api.js

      - name: Upload userscripts
        if: matrix.node == 24
        uses: actions/upload-artifact@v5
        with:
          name: timeforest-userscripts
          path: |
            dist/timeforest.user.js
            dist/timeforest-app.user.js
          if-no-files-found: error

  client:
    name: client boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      # Electron needs a display and a sandbox we don't get on a CI runner.
      # This isn't an end-to-end test — it proves main.js loads, the preload
      # bridge resolves, and nothing throws before the window would appear.
      - name: Smoke-test the main process
        working-directory: client
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run --auto-servernum node ../scripts/smoke-client.js
