name: Release

# Push a tag like `v0.2.0` to cut a GitHub Release with every distributable
# attached: the two userscripts, the load-unpacked extension zip, and the desktop
# app for Windows / macOS / Linux. `workflow_dispatch` runs the same build but
# only uploads workflow artifacts (no Release) — handy for a dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the Release and upload assets

jobs:
  # --- lightweight: userscripts + extension zip (seconds, no Electron) ---------
  bundles:
    name: userscripts + extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Name the artifacts after the tag (v0.2.0 -> 0.2.0) so a release's files
      # match its version. On a manual dispatch there's no tag; keep package.json.
      - name: Sync version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "for (const f of ['package.json','client/package.json']){const p=require('./'+f);p.version='$V';require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n');}"

      - name: Build userscripts
        run: |
          node build-userscript.js
          node build-app-userscript.js

      # The load-unpacked extension is manifest.json + src/ + icons/ (the shared
      # libs live in src/lib, already inside src/). Nothing else is referenced.
      - name: Zip the extension
        run: zip -r timeforest-extension.zip manifest.json src icons

      - name: Collect
        run: |
          mkdir -p out
          cp dist/timeforest.user.js dist/timeforest-app.user.js timeforest-extension.zip out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: out/*
          if-no-files-found: error

      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  # --- heavyweight: the Electron desktop app, one runner per OS ----------------
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Sync version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "for (const f of ['package.json','client/package.json']){const p=require('./'+f);p.version='$V';require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n');}"

      # electron + electron-builder are devDependencies of client/. `npm run dist`
      # (root) invokes client's electron-builder against electron-builder.config.js;
      # the target is chosen from the runner OS (nsis+zip on win, dmg on mac,
      # AppImage on linux). Unsigned — this is an unofficial client (see README).
      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Build desktop app
        run: npm run dist
        env:
          # Don't try to notarize/sign or auto-publish; just build the artifacts.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          cp client/dist/*.exe client/dist/*.zip client/dist/*.dmg client/dist/*.AppImage out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
