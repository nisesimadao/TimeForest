<!-- TimeForest app icon.
     Time + Forest: a clock face, with a leaf growing off it.

     Constraints that shaped it: the smallest place this ever renders is a
     16px tray slot, so the silhouette has to survive at 16px — one ring, one
     bump, nothing else. It must also not be mistaken for TimeTree's own mark
     (a leaf on white); ours is a ring on green, which reads differently even
     at a glance. Colours are the app's own --accent ramp. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ee39a"/>
      <stop offset="1" stop-color="#20a86c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00301c" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- iOS/Windows both round the corners themselves at some sizes; a squircle
       at 22% keeps it from looking wrong under either. -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <!-- the clock -->
    <circle cx="256" cy="272" r="132" fill="none" stroke="#ffffff" stroke-width="30"/>
    <!-- hands at 10:10 — the pose every clock is drawn in, because it reads as
         "a clock" faster than any other, and leaves the top open for the leaf -->
    <path d="M256 272 L256 196" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    <path d="M256 272 L316 308" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>

    <!-- the leaf, growing out of the top-right of the dial -->
    <path d="M352 168 C352 106 404 68 456 68 C456 130 404 168 352 168 Z" fill="#ffffff"/>
    <path d="M456 68 C420 96 392 132 372 164" stroke="#20a86c" stroke-width="13" stroke-linecap="round" fill="none"/>
  </g>
</svg>
