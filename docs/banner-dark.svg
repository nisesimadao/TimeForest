<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 290" preserveAspectRatio="xMidYMid meet" role="img" aria-label="TimeForest — TimeTree 非公式クライアント">
  <!-- The app's dark theme, not a darkened copy of the light one:
       --bg #1c1c1e, --label-1 #f2f2f7, --label-2 #a1a1aa, --accent #30d158.
       The accent really is a different green in the two themes — each is picked
       for contrast against its own background. -->
  <rect width="1160" height="290" fill="#1c1c1e"/>

  <g transform="translate(742 60)">
    <g stroke="#3a3a3e" stroke-width="1">
      <line x1="0"   y1="0" x2="0"   y2="180"/>
      <line x1="52"  y1="0" x2="52"  y2="180"/>
      <line x1="104" y1="0" x2="104" y2="180"/>
      <line x1="156" y1="0" x2="156" y2="180"/>
      <line x1="208" y1="0" x2="208" y2="180"/>
      <line x1="260" y1="0" x2="260" y2="180"/>
      <line x1="312" y1="0" x2="312" y2="180"/>
      <line x1="364" y1="0" x2="364" y2="180"/>
    </g>
    <line x1="0" y1="180" x2="364" y2="180" stroke="#55555c" stroke-width="1.5"/>

    <g fill="#30d158">
      <rect x="10"  y="120" width="32" height="60"  rx="4" opacity="0.5"/>
      <rect x="62"  y="76"  width="32" height="104" rx="4" opacity="0.7"/>
      <rect x="114" y="32"  width="32" height="148" rx="4"/>
      <rect x="166" y="92"  width="32" height="88"  rx="4" opacity="0.7"/>
      <rect x="218" y="54"  width="32" height="126" rx="4" opacity="0.85"/>
      <rect x="270" y="132" width="32" height="48"  rx="4" opacity="0.4"/>
      <rect x="322" y="102" width="32" height="78"  rx="4" opacity="0.55"/>
    </g>

    <circle cx="130" cy="16" r="6.5" fill="#30d158"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif">
    <text x="88" y="140" font-size="66" font-weight="700" fill="#f2f2f7" letter-spacing="-1.5">TimeForest</text>
    <text x="90" y="182" font-size="23" font-weight="400" fill="#a1a1aa">TimeTree 非公式クライアント</text>
    <text x="90" y="221" font-size="17" font-weight="400" fill="#a1a1aa">デスクトップアプリ ／ Chrome 拡張 ／ ユーザースクリプト ／ CLI ／ MCP</text>
  </g>

  <rect x="70" y="96" width="4" height="130" rx="2" fill="#30d158"/>
</svg>
