<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 290" preserveAspectRatio="xMidYMid meet" role="img" aria-label="TimeForest — TimeTree 非公式クライアント">
  <!-- Colours are the app's own, not a palette picked for a banner:
       --bg #ffffff, --label-1 #1c1c1e, --label-2 #62636b, --accent #12a45f.
       Two files rather than one with a media query, because GitHub strips CSS
       out of SVGs it renders; the README picks between them with <picture>. -->
  <rect width="1160" height="290" fill="#ffffff"/>

  <!-- The motif is what the app actually draws: a week of columns, with event
       bars stacked in them. Read the tops and it is a treeline. Sized to sit
       inside the 1200-wide viewBox with room to spare — the whole treeline has
       to survive the README scaling it down, or it just clips the last day. -->
  <g transform="translate(742 60)">
    <!-- seven day columns, 52px apart -->
    <g stroke="#e7e7ea" stroke-width="1">
      <line x1="0"   y1="0" x2="0"   y2="180"/>
      <line x1="52"  y1="0" x2="52"  y2="180"/>
      <line x1="104" y1="0" x2="104" y2="180"/>
      <line x1="156" y1="0" x2="156" y2="180"/>
      <line x1="208" y1="0" x2="208" y2="180"/>
      <line x1="260" y1="0" x2="260" y2="180"/>
      <line x1="312" y1="0" x2="312" y2="180"/>
      <line x1="364" y1="0" x2="364" y2="180"/>
    </g>
    <line x1="0" y1="180" x2="364" y2="180" stroke="#c9c9ce" stroke-width="1.5"/>

    <!-- event bars, bottom-anchored, heights making a treeline -->
    <g fill="#12a45f">
      <rect x="10"  y="120" width="32" height="60"  rx="4" opacity="0.55"/>
      <rect x="62"  y="76"  width="32" height="104" rx="4" opacity="0.75"/>
      <rect x="114" y="32"  width="32" height="148" rx="4"/>
      <rect x="166" y="92"  width="32" height="88"  rx="4" opacity="0.75"/>
      <rect x="218" y="54"  width="32" height="126" rx="4" opacity="0.9"/>
      <rect x="270" y="132" width="32" height="48"  rx="4" opacity="0.45"/>
      <rect x="322" y="102" width="32" height="78"  rx="4" opacity="0.6"/>
    </g>

    <!-- today's dot, on the tallest -->
    <circle cx="130" cy="16" r="6.5" fill="#12a45f"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif">
    <text x="88" y="140" font-size="66" font-weight="700" fill="#1c1c1e" letter-spacing="-1.5">TimeForest</text>
    <text x="90" y="182" font-size="23" font-weight="400" fill="#62636b">TimeTree 非公式クライアント</text>
    <text x="90" y="221" font-size="17" font-weight="400" fill="#62636b">デスクトップアプリ ／ Chrome 拡張 ／ ユーザースクリプト ／ CLI ／ MCP</text>
  </g>

  <rect x="88" y="96" width="4" height="0" fill="#12a45f"/>
  <rect x="70" y="96" width="4" height="130" rx="2" fill="#12a45f"/>
</svg>
