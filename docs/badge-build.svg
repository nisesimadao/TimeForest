<svg xmlns="http://www.w3.org/2000/svg" width="120" height="20" role="img" aria-label="build step: none">
  <linearGradient id="g_build" x2="0" y2="100%"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
  <clipPath id="r_build"><rect width="120" height="20" rx="3" fill="#fff"/></clipPath>
  <g clip-path="url(#r_build)">
    <rect width="80" height="20" fill="#42474e"/>
    <rect x="80" width="40" height="20" fill="#12a45f"/>
    <rect width="120" height="20" fill="url(#g_build)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="40" y="15" fill="#010101" fill-opacity=".3">build step</text>
    <text x="40" y="14">build step</text>
    <text x="100" y="15" fill="#010101" fill-opacity=".3">none</text>
    <text x="100" y="14">none</text>
  </g>
</svg>
